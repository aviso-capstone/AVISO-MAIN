[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; No [unix_http_server]/supervisorctl: App Platform's sandbox loops forever on
; "Unlinking stale socket" and supervisord never starts nginx. Reverb and the
; queue worker instead wait for /tmp/aviso-ready, which the entrypoint creates
; after migrations.

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Live SOS/rider map broadcasts. Only reachable through nginx's /app/ proxy.
[program:reverb]
command=sh -c 'until [ -f /tmp/aviso-ready ]; do sleep 2; done; exec php /var/www/html/artisan reverb:start --host=127.0.0.1 --port=8081'
autorestart=true
user=www-data
environment=HOME="/var/www",USER="www-data"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queued broadcasts (e.g. RiderLocationUpdated). Polling the jobs table also
; keeps the Supabase free-tier project from pausing.
[program:queue-worker]
command=sh -c 'until [ -f /tmp/aviso-ready ]; do sleep 2; done; exec php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600'
autorestart=true
stopwaitsecs=30
user=www-data
environment=HOME="/var/www",USER="www-data"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
