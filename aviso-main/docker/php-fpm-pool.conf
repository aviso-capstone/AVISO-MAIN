[www]
; Sized for a 1 GB App Platform container shared with nginx, Reverb and the
; queue worker. Each php-fpm worker uses ~40-60 MB.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Recycle workers to contain memory leaks.
pm.max_requests = 500
request_terminate_timeout = 60

; Pass App Platform env vars through to PHP.
clear_env = no

; Workers run as www-data; keep libpq away from /root/.postgresql.
env[HOME] = /var/www
